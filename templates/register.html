<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign Up | PlatformAI</title>

    <link rel="stylesheet" href="/static/css/register.css">
</head>

<body>

    <div class="register-card">

        <div class="logo">PlatformAI</div>

        <h1>Create Account</h1>

        <p class="subtitle">
            Join PlatformAI Photo Sharing Platform
        </p>

        <form id="registerForm" method="POST">

            <!-- Full Name -->
            <div class="form-group">

                <label for="fullname">Full Name</label>

                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    placeholder="Enter your full name"
                    required
                >

                <small id="fullnameError" class="error-message"></small>

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

                <small id="emailError" class="error-message"></small>

            </div>


            <!-- Password -->
            <div class="form-group">

                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

                <small id="passwordError" class="error-message"></small>

            </div>


            <!-- Account Type -->
            <div class="form-group">

                <label for="role">Account Type</label>

                <select id="role" name="role" required>

                    <option value="">Select account type</option>

                    <option value="Admin">
                        Admin
                    </option>

                    <option value="Team Member">
                        Team Member
                    </option>

                </select>

                <small id="roleError" class="error-message"></small>

            </div>


            <!-- Admin Email -->
            <div
                class="form-group"
                id="adminEmailGroup"
                style="display: none;"
            >

                <label for="admin_email">
                    Admin Email
                </label>

                <input
                    type="email"
                    id="admin_email"
                    name="admin_email"
                    placeholder="Enter your Admin email"
                >

                <small id="adminEmailError" class="error-message"></small>

            </div>


            <!-- Register Button -->
            <button
                type="submit"
                class="register-btn"
            >
                Create Account
            </button>

        </form>


        <div id="message"></div>


        <p class="login-link">

            Already have an account?

            <a href="/login">
                Sign In
            </a>

        </p>


        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>


    <script src="/static/js/register.js"></script>

</body>
</html>
