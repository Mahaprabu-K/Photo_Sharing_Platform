
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Sign In | PlatformAI</title>

    <link rel="stylesheet"
          href="/static/css/login.css">

</head>


<body>

    <div class="login-card">

        <div class="logo">
            PlatformAI
        </div>

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Sign in to continue to your account
        </p>


        <form id="loginForm" method="POST">

            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >
                 <small id="emailError" class="error-message"></small>

            </div>


            <div class="form-group">

                <label for="password">
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >
                 <small id="passwordError" class="error-message"></small>

            </div>


            <button
                type="submit"
                class="login-btn">

                Sign In

            </button>

        </form>


        <div id="message"></div>


        <p class="register-link">

            Don't have an account?

            <a href="/register">
                Sign Up
            </a>

        </p>


        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </div>


    <script src="/static/js/login.js"></script>

</body>

</html>
