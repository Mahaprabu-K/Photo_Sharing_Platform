<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <link rel="stylesheet" href="../static/css/upload_photos.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Photos</title>
</head>
<body>

    <h1>Upload Photos</h1>

    <h2 id="eventName">Loading event...</h2>

    <form id="uploadForm">

        <input
            type="file"
            id="photoFiles"
            name="photos"
            accept="image/*"
            multiple
            required
        >

        <br><br>

        <button type="submit">
            Upload Photos
        </button>

    </form>

    <p id="message"></p>

    <br>

    <a href="/team">Back to Dashboard</a>

    <script src="/static/js/upload_photos.js"></script>

</body>
</html>
